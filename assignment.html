<!DOCTYPE html>
<html lang="en" style="height:100%;">
    <head>
        <meta charset="UTF-8">
        <title>English 2 Portfolio</title>
    </head>
    <body style="margin:0; height:100%; display:flex; flex-direction:column;">
        <!-- Header -->
        <div style="display:flex; background-color:#FFADF0;">
            <style> #home-button:hover {background-color: #FF69C5 !important;} </style>
            <a id="home-button" href="index.html" style="text-decoration:none; width:50px; height:50px; display:flex; justify-content:center; align-items:center; background-color:#FF8BDB; color:#000000;">Home</a>
            <span style="display:flex; justify-content:center; align-items:center; padding:0 10px;">English 2 Portfolio</span>
        </div>

        <!-- Content -->
        <iframe id="assignment-iframe" style="width:850px; max-width:calc(100%-40px); height:100%; margin:20px; border:1px solid #000000"></iframe>
        <div style="margin-left:20px; width:850px; max-width:calc(100%-40px);">
            <h2>Reflection</h2>
            <p id="reflection-paragraph"></p>
        </div>

        <script>
            // Get assignment name from url parameter
            const params = new URLSearchParams(window.location.search);
            const assignmentName = params.get("assignment-name");

            // Set iframe link
            document.getElementById("assignment-iframe").src = "assignments/" + assignmentName + ".pdf#toolbar=0&view=FitH";
        
            // Set reflection text
            nameToReflection = {
                "reading-response-1": "The idea of a curio cabinet has been on my mind since learning about it. This reading has given me an appreciation for curiosity. In my school assignments, I would like to choose topics based on my curiosities whenever possible.",
                "reading-response-2": "In the process of evaluating this source using the CRAAP test, I realized that the test is very subjective. Two different people may arrive at different CRAAP scores for the same source. I also believe that credibility is not as straightforward as some may believe. There are instances where less educated sources are more accurate than science/government-based sources. I value sources that challenge commonly accepted \"facts\".",
                "reading-response-3": "I felt that I was able to make plenty of revisions throughout my revision process. The feedback from my peers was very useful. I particularly lengthened my project, I added a hook, and I accounted for confusion by including a flowchart.",
                "task-1-brainstorm": "This brainstorm was messy in a sense that I spewed many random interests onto the page. I included some of my deep passions, but I ended up choosing a topic that I was only somewhat passionate about. Choosing my topic was a hard decision, because choosing one of my main passions could mean that I was copying my topic from my previous English class.",
                "task-1-reflection": "This was my first major reflection in this class. It made me realize the benefits of creating a rough draft for writing assignments.",
                "task-1": "I am happy with the topic that I proposed, although there would have been better options that I would have enjoyed more. At the time of proposing my topic, I had passion for team work, but I eventually became more interested in individual work. I would have instead wanted to do a research project about individual work strategies. This would have been a great way to go against a common research topic.",
                "task-2-reflection": "Throughout this reflection, I realized that I accomplished all learning outcomes. In future assignments, I plan to focus more on my learning outcomes while I am doing the assignment. This will help to guide me on the correct path.",
                "task-2-samples": "It was useful to view project samples from previous students. I considered the length of the projects, as well as the evidence cited, and how detailed the research plans were.",
                "task-2-v1": "My first draft of this assignment was a very rough skeleton. I was missing some components of the assignment, so I wasn't able to get peer feedback on those missing components. This put me at a disadvantage, but I was able to make a lot of good revisions. Since I have learned from this assignment, I chose to put more work into the first draft of my remediation because I wanted to make sure that my peers could give me valuable feedback.",
                "task-2-v2": "I feel that I've had a lot of success with this project. My revision process was very beneficial. I also like that my theoretical research plan is very specific. I believe it could achieve real results.",
                "task-3-v1": "In the draft of my remediation, I was able to hit all of the required components of the assignment. This did not leave me with as much room for revision. I felt that my draft was generally low on content, so I wanted to add more quotes, and generally more writing to each slide.",
                "task-3-v2": "I like how my slideshow came out. I chose to add more writing than a traditional slideshow because this slideshow would not be verbally presented. I like the simple theme that I used for my slides. I also like that my content was clear and concise."
            }

            document.getElementById("reflection-paragraph").innerText = nameToReflection[assignmentName]
        </script>
    </body>
</html>
