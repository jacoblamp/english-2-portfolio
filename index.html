<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>English 2 Portfolio</title>

        <!-- React + ReactDOM CDN -->
        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
        <!-- Babel for JSX support -->
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    </head>
    <body style="margin: 0; padding-bottom:20px;">
        <!-- Header -->
        <div style="background-image:url(images/title.png); background-repeat:no-repeat; background-size:cover; background-position:center; margin-bottom: 20px; padding: 30px 20px;">
            <h1 style="text-shadow:0 0 10px #FFFFFF; font-family:Tahoma, sans-serif; font-size:40px;">English 2 Portfolio</h1>
            <h3 style="text-shadow:0 0 10px #FFFFFF; font-family:Tahoma, sans-serif; font-size:25px;">Jacob Lamp</h3>
        </div>
        
        <div id="root"></div>

        <style> #tile:hover {background-color: #FF69C5 !important;} </style>
        <script type="text/babel">
            function Tile({title, assignmentName}) {
                return (
                    <a href={"assignment.html?assignment-name=" + assignmentName} style={{textDecoration:"none", color:"#000000"}}>
                        <div style={{
                            width: "200px",
                            height: "200px",
                            borderRadius: "8px",
                            display: "flex",
                            flexDirection: "column",
                            overflow: "hidden",
                            boxShadow: "0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19)"
                        }}>
                            <div style={{overflow:"hidden", height:"160px"}}>
                                <img src={"images/" + assignmentName + ".png"} style={{width:"100%", height:"100%", objectFit:"cover"}} />
                            </div>
                            <span style={{height:"40px", fontFamily:"Tahoma, sans-serif", margin:"5px", textAlign:"center", verticalAlign:"middle", lineHeight:"40px"}}>{title}</span>
                        </div>
                    </a>
                );
            }

            function Section({name, children}) {
                return (
                    <>
                        <h1>{name}</h1>
                        <div style={{display:"flex", gap:"20px", flexWrap:"wrap"}}>
                            {children}
                        </div>
                    </>
                );
            }

            function App() {
                return (
                    <div style={{marginLeft:"20px"}}>
                        <Section name="Reading Responses">
                            <Tile title="Research Communities" assignmentName="reading-response-1"/>
                            <Tile title="CRAAP Test" assignmentName="reading-response-2"/>
                            <Tile title="The Revision Plan" assignmentName="reading-response-3"/>
                        </Section>
                        <Section name="Topic Proposal">
                            <Tile title="Brainstorm" assignmentName="task-1-brainstorm"/>
                            <Tile title="Topic Proposal" assignmentName="task-1"/>
                            <Tile title="Reflection" assignmentName="task-1-reflection"/>
                        
                        </Section>
                        <Section name="Research Project">
                            <Tile title="Project Samples" assignmentName="task-2-samples"/>
                            <Tile title="Research Project Draft" assignmentName="task-2-v1"/>
                            <Tile title="Research Project" assignmentName="task-2-v2"/>
                            <Tile title="Reflection" assignmentName="task-2-reflection"/>
                        </Section>
                        <Section name="Remediation">
                            <Tile title="Remediation Draft" assignmentName="task-3-v1"/>
                            <Tile title="Remediation" assignmentName="task-3-v2"/>
                        </Section>
                        <div style={{"width":"500px"}}>
                            <h1>Learning Outcomes</h1>
                            <p></p>
                            <h2>Generating Inquiry</h2>
                            <p>I found myself generating inquiry at times when I had questions about the writing process. I often search for answers to my questions online, and this helps me to learn things very quickly. As soon as I generate a question, I can find answers within seconds thanks to the internet.</p>
                            <h2>Multiple ways of writing</h2>
                            <p>I did not integrate multimodality in my early assignments, but I began using it in my research project and remediation. I included a helpful flowchart to show my research plan in my research project. This would be useful for people who are skimming my project, or if they have any confusion about the research setup. I also used many pictures in my remediation because I chose to create a slideshow. The pictures help to make the project feel more real, by helping the audience to visualize the content.</p>
                            <h2>Information Literacy</h2>
                            <p>I used the CRAAP test to evaluate the credibility of sources. I did not run into many sources that had significant credibility issues. I also chose a topic that has no obvious biases involved. Even though I considered the education level of my chosen authors, I believe that there are other factors more important than education. Some sources can still be valuable if they are created by an uneducated author because they may offer a unique perspective.</p>
                            <h2>Research Genre Production</h2>
                            <p>My research project was an example of writing with a constraint in place. I had to write this assignment under an academic tone. This means that my writing should generally be more short and concise, particularly in the research plan section. I also included a flowchart, which is fitting for the academic tone. Typically these articles are skimmed before being read, so a flowchart can aid in the skimming process.</p>
                            <h2>Contributing Knowledge</h2>
                            <p>I have analyzed primary sources in my research project. One primary source included interview responses which I drew conclusions about. I have also analyzed various other primary sources in other assignments, and I considered the credibility of each source.</p>
                            <h2>Revision</h2>
                            <p>I have demonstrated this learning outcome by revising my research project and my remediation. I have used the help of my peer reviews to make my revisions. I realize that revision is a very powerful tool. Typically a first draft will have many flaws, so it is necessary to gather opinions from other people.</p>
                        </div>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById("root"));
            root.render(<App />);
        </script>
    </body>
</html>
